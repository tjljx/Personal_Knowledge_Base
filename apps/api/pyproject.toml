[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-knowledge-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge_api*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI's Depends uses this intentional default pattern.
