name: personal-knowledge-base

x-api-common: &api-common
  image: personal-knowledge-api:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  env_file:
    - .env.selfhost
  environment:
    STORAGE_ROOT: /app/data/files
    EMBEDDING_BASE_URL: http://ollama:11434
    VECTOR_STORE_URL: http://qdrant:6333
    RERANK_BASE_URL: http://reranker:8000
  volumes:
    - original_files:/app/data/files
    - backup_files:/app/backups
  networks:
    - internal

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.selfhost}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - internal

  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - internal

  ollama:
    image: ollama/ollama:0.34.1
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - internal

  reranker:
    image: personal-knowledge-reranker:local
    build:
      context: .
      dockerfile: apps/reranker/Dockerfile
    environment:
      RERANK_MODEL: BAAI/bge-reranker-base
      RERANK_CACHE_DIR: /models
      RERANK_THREADS: "4"
    volumes:
      - rerank_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    networks:
      - internal

  migrate:
    <<: *api-common
    command: ["python", "-m", "alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-common
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
    restart: unless-stopped

  worker:
    <<: *api-common
    command: ["python", "-m", "knowledge_api.worker", "--poll-seconds", "2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "knowledge_api.healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  web:
    image: personal-knowledge-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PKB_BIND_ADDRESS:-127.0.0.1}:${PKB_WEB_PORT:-8765}:80"
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:

volumes:
  postgres_data:
  original_files:
  backup_files:
  qdrant_data:
  ollama_models:
  rerank_models:
